name: 桌面端打包

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'src-tauri/**'
      - 'ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/desktop-build.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'src-tauri/**'
      - 'ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败不影响其它平台出包：签名、runner 环境这类问题
      # 常常只在单个平台出现，没必要让全部重跑。
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows (x64)

    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          # 桌面端的 target 在 src-tauri 下，与 CLI 的 rust/ 是两套，分开缓存。
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      # aws-lc-sys（rustls 的默认 provider，由 tiberius-ng 与 reqwest 间接引入）
      # 用 cmake 构建 C 源码。GitHub 的 runner 预装了 cmake，
      # 这里显式确认一次，缺了就直接给出可读的报错，而不是让构建卡在 C 编译上。
      - name: 确认 cmake 可用
        shell: bash
        run: cmake --version

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 前端类型检查
        run: pnpm typecheck

      # 打完包不发布 Release，只上传产物：签名与公证还没做，
      # 未签名的 dmg 不适合直接推到 Release 让人下载。
      - name: 打包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: SqlFeishuSync-${{ matrix.target }}
          # .app 是目录，upload-artifact 会自动压成 zip。
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 30
